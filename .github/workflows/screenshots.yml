name: Screenshots

# Manual only. Builds the debug APK, runs it on an emulator and captures every page and state
# (.github/screenshots/shots.sh). The PNGs come back as the "screenshots" artifact.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: "debug, or qa (same debug hooks, but shrunk and optimized by R8 like release)"
        type: choice
        default: debug
        options: [debug, qa]

permissions:
  contents: read

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Jerusalem
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '9.8.2'

      - name: Build the APK (${{ inputs.variant }})
        run: gradle assembleDirect${{ inputs.variant == 'qa' && 'Qa' || 'Debug' }} --no-daemon --stacktrace

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the app on an emulator and capture every screen
        env:
          APK: app/build/outputs/apk/direct/${{ inputs.variant }}/app-direct-${{ inputs.variant }}.apk
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -timezone Asia/Jerusalem
          script: bash .github/screenshots/shots.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshots
          path: shots/
          if-no-files-found: warn
