name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# The job only needs to publish the release; nothing else.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      # Actions are pinned to commit SHAs so a hijacked tag cannot change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # The platform and build-tools the project needs are fetched by the Android Gradle plugin itself.
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '9.8.2'

      - name: Restore signing keystore
        if: env.KEYSTORE_B64 != ''
        run: echo "$KEYSTORE_B64" | base64 -d > app/release.p12

      - name: Build the direct APK and the Google Play bundle
        run: gradle assembleDirectRelease bundlePlayRelease --no-daemon --stacktrace

      - name: Lint (report only, never blocks)
        continue-on-error: true
        run: gradle lintPlayRelease --no-daemon

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-playRelease.html
          if-no-files-found: ignore

      - name: Collect APK and bundle
        run: |
          cp app/build/outputs/apk/direct/release/app-direct-release.apk ukshartem.apk
          cp app/build/outputs/bundle/playRelease/app-play-release.aab ukshartem.aab

      - name: Verify the Google Play bundle
        run: |
          jarsigner -verify ukshartem.aab | tail -1
          echo "play id occurrences:   $(unzip -p ukshartem.aab base/manifest/AndroidManifest.xml | grep -a -c 'app.ukshartem' || true)"
          echo "device admin in play:  $(unzip -p ukshartem.aab base/manifest/AndroidManifest.xml | grep -a -c 'BIND_DEVICE_ADMIN' || true)"
          echo "battery perm in play:  $(unzip -p ukshartem.aab base/manifest/AndroidManifest.xml | grep -a -c 'REQUEST_IGNORE_BATTERY_OPTIMIZATIONS' || true)"
          ls -la ukshartem.aab

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ukshartem-play-bundle
          path: ukshartem.aab

      - name: Verify APK signature and manifest
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/apksigner" verify --verbose --print-certs ukshartem.apk
          "$BT/aapt2" dump badging ukshartem.apk | grep -E "^package|sdkVersion|targetSdkVersion|uses-permission|launchable" || true
          ls -la ukshartem.apk

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ukshartem-apk
          path: ukshartem.apk

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y --repo "$GITHUB_REPOSITORY" || true
          gh release create latest ukshartem.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "וקשרתם - גרסה אחרונה" \
            --notes "Build from commit ${GITHUB_SHA}" \
            --latest
